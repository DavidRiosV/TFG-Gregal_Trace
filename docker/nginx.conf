# Nginx delante de Gunicorn (proxy inverso, Despliegue diapositiva 23)
server {
    listen 80;

    # Tamaño máximo de lo que se sube (los PDF de los albaranes)
    client_max_body_size 20M;

    # CSS, JavaScript, imágenes y fuentes: los sirve Nginx directamente, sin pasar por Django
    location /static/ {
        alias /app/static/;
    }

    # Los archivos de /media/ (albaranes) NO se sirven aquí a propósito:
    # así solo se pueden abrir desde la web, con la sesión iniciada.

    # Todo lo demás lo responde Django a través de Gunicorn (el contenedor «web», puerto 8000)
    location / {
        proxy_pass http://web:8000;
        # $http_host conserva el puerto (localhost:8080), que Django usa para comprobar el CSRF
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
