<div class="campo">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    <div class="entrada{% if campo.errors %} entrada--error{% endif %}">{{ campo }}</div>
    {% if campo.help_text %}<div class="ayuda-campo">{{ campo.help_text|safe }}</div>{% endif %}
    {% for error in campo.errors %}<p class="error-campo">{{ error }}</p>{% endfor %}
</div>
